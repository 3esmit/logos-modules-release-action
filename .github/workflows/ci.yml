name: CI

# Lints this action's own workflows + scripts so a regression is
# caught before the v1 tag is advanced (consumers pin @v1, so a bad
# push to the v1 line breaks every catalog at once).
# The former `python:` job moved with the index implementation; this
# workflow only invokes it and owns no Python sources to compile or test.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # actionlint also runs shellcheck on `run:` blocks when shellcheck
      # is on PATH (preinstalled on ubuntu-latest runners).
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          # job.workflow_repository and job.workflow_sha are documented
          # reusable-workflow contexts, but actionlint does not model them.
          # Keep the exception narrow so every other expression is linted.
          ./actionlint -color \
            -ignore 'property "workflow_(repository|sha)" is not defined'

      - name: yamllint
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user yamllint
          "$(python3 -m site --user-base)/bin/yamllint" -s .

      - name: Release variant matrix
        run: scripts/test-release-variant-matrix.sh

      - name: Release package target inputs
        run: scripts/test-release-target-inputs.sh

      - name: Release artifact variants
        run: scripts/test-release-artifact-variants.sh

      - name: LGX tool source pin
        run: scripts/test-lgx-tool-source-pin.sh

      - name: Linux release disk reclamation contract
        run: scripts/test-release-linux-disk-space.sh

  lgx-tool-pin:
    name: Pinned LGX tool
    runs-on: ubuntu-latest
    steps:
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Build the reviewed LGX tool
        shell: bash
        run: |
          set -euo pipefail
          nix build 'github:logos-co/logos-package/8d4236f9453bce8b44dfd2f85a5006af993b7ed2#lgx' --no-link
